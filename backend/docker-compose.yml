services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: credora
      POSTGRES_USER: credora
      POSTGRES_PASSWORD: credora
    ports:
      - "5432:5432"
    volumes:
      - credora_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/credora
      SPRING_DATASOURCE_USERNAME: credora
      SPRING_DATASOURCE_PASSWORD: credora
      CREDORA_ALLOWED_ORIGINS: ${CREDORA_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  credora_db_data:
