server:
  port: ${PORT:8080}

spring:
  application:
    name: credora-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/credora}
    username: ${SPRING_DATASOURCE_USERNAME:credora}
    password: ${SPRING_DATASOURCE_PASSWORD:credora}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # "update" lets Hibernate create/adjust tables from the @Entity classes on
      # startup - no manual migration tool needed for this project's size.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    # Run data.sql AFTER Hibernate has created the tables, not before.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

# Comma-separated list of origins allowed to call this API (see CorsConfig).
# The Vite dev server defaults to http://localhost:5173.
credora:
  allowed-origins: ${CREDORA_ALLOWED_ORIGINS:http://localhost:5173}
